<?xml version="1.0" encoding="UTF-8"?>
<svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A8847;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4388B5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rectangle de fond arrondi -->
  <rect width="72" height="72" rx="10.799999999999999" fill="url(#bgGradient)"/>
  
  <!-- Symbole livre/parchemin -->
  <g transform="translate(36, 36)">
    <!-- Livre ouvert -->
    <path d="M -18 -10.799999999999999 L -10.799999999999999 -14.4 L -10.799999999999999 14.4 L -18 10.799999999999999 Z" 
          fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.5)" stroke-width="0.72"/>
    <path d="M 10.799999999999999 -14.4 L 18 -10.799999999999999 L 18 10.799999999999999 L 10.799999999999999 14.4 Z" 
          fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.5)" stroke-width="0.72"/>
    
    <!-- Lignes de texte -->
    <line x1="-14.4" y1="-3.6" x2="14.4" y2="-3.6" 
          stroke="rgba(106,136,71,0.6)" stroke-width="0.5760000000000001" stroke-linecap="round"/>
    <line x1="-14.4" y1="0" x2="14.4" y2="0" 
          stroke="rgba(106,136,71,0.6)" stroke-width="0.5760000000000001" stroke-linecap="round"/>
    <line x1="-14.4" y1="3.6" x2="14.4" y2="3.6" 
          stroke="rgba(106,136,71,0.6)" stroke-width="0.5760000000000001" stroke-linecap="round"/>
  </g>
</svg>