<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A8847;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4388B5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rectangle de fond arrondi -->
  <rect width="128" height="128" rx="19.2" fill="url(#bgGradient)"/>
  
  <!-- Symbole livre/parchemin -->
  <g transform="translate(64, 64)">
    <!-- Livre ouvert -->
    <path d="M -32 -19.2 L -19.2 -25.6 L -19.2 25.6 L -32 19.2 Z" 
          fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.5)" stroke-width="1.28"/>
    <path d="M 19.2 -25.6 L 32 -19.2 L 32 19.2 L 19.2 25.6 Z" 
          fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.5)" stroke-width="1.28"/>
    
    <!-- Lignes de texte -->
    <line x1="-25.6" y1="-6.4" x2="25.6" y2="-6.4" 
          stroke="rgba(106,136,71,0.6)" stroke-width="1.024" stroke-linecap="round"/>
    <line x1="-25.6" y1="0" x2="25.6" y2="0" 
          stroke="rgba(106,136,71,0.6)" stroke-width="1.024" stroke-linecap="round"/>
    <line x1="-25.6" y1="6.4" x2="25.6" y2="6.4" 
          stroke="rgba(106,136,71,0.6)" stroke-width="1.024" stroke-linecap="round"/>
  </g>
</svg>