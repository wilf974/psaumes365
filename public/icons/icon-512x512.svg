<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec dégradé -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A8847;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4388B5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rectangle de fond arrondi -->
  <rect width="512" height="512" rx="76.8" fill="url(#bgGradient)"/>
  
  <!-- Symbole livre/parchemin -->
  <g transform="translate(256, 256)">
    <!-- Livre ouvert -->
    <path d="M -128 -76.8 L -76.8 -102.4 L -76.8 102.4 L -128 76.8 Z" 
          fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.5)" stroke-width="5.12"/>
    <path d="M 76.8 -102.4 L 128 -76.8 L 128 76.8 L 76.8 102.4 Z" 
          fill="rgba(255,255,255,0.9)" stroke="rgba(255,255,255,0.5)" stroke-width="5.12"/>
    
    <!-- Lignes de texte -->
    <line x1="-102.4" y1="-25.6" x2="102.4" y2="-25.6" 
          stroke="rgba(106,136,71,0.6)" stroke-width="4.096" stroke-linecap="round"/>
    <line x1="-102.4" y1="0" x2="102.4" y2="0" 
          stroke="rgba(106,136,71,0.6)" stroke-width="4.096" stroke-linecap="round"/>
    <line x1="-102.4" y1="25.6" x2="102.4" y2="25.6" 
          stroke="rgba(106,136,71,0.6)" stroke-width="4.096" stroke-linecap="round"/>
  </g>
</svg>